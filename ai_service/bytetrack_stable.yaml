# ByteTrack 안정화 설정 (49번 실시간 다중 인물용)
# Ultralytics 기본 bytetrack.yaml과 비교해 바꾼 값:
#   track_high_thresh 0.25 → 0.5 : 확실한 사람만 1단계 매칭
#   new_track_thresh  0.25 → 0.6 : 애매한 검출로 새 ID를 만들지 않음 (깜빡이는 가짜 ID 감소)
#   track_buffer      30   → 60  : 잠깐 가려져도 약 3초(20fps 기준)까지 같은 ID 유지
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 60
match_thresh: 0.8
fuse_score: True
